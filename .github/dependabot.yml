version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      test-tooling:
        patterns:
          - vitest
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
    labels:
      - dependencies
      - needs-review

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
