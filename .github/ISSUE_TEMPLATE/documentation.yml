name: Documentation issue
description: Report unclear, inaccurate, inaccessible, or outdated project documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety confirmation
      options:
        - label: I included no personal information, secret, private URL, or public website dispute.
          required: true
