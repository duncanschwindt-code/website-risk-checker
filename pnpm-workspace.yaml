allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.9

overrides:
  brace-expansion: 5.0.9
  postcss: 8.5.25
  sharp: 0.35.3

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

# Optional WASI bindings for Rolldown and the resolver intentionally pin these 1.x peers.
peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime>@emnapi/core": "1"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1"
